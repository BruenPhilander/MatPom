<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>For Chyler 💗</title>
	
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<main class="envelope-page">
		<a href="memories.html" class="envelope-link" onclick="openMemories(event)">
	
			<div class="envelope">
			
				<!--THE LETTER INSIDE -->
				<div class="letter">
					<p>Before we look ahead, let's look back!</p>
				</div>
			
				<!-- BACK OF THE ENVELOPE-->
				<div class="envelope-back"></div>
			
				<!-- LEFT AND RIGHT FOLDS-->
				<div class="fold-left"></div>
				<div class="fold-right"></div>
			
				<!-- BOTTOM FOLD-->
				<div class="fold-bottom"></div>
			
				<!-- OPENING FLAP -->
				<div class="flap"></div>
				
				<!-- TEXT ON ENVELOPE -->
				<div class="envelope-message">
					<p>To: Chyler♥</p>
				</div>
			
				<!-- HEART SEAL -->
				<div class="heart">♥</div>
			
			</div>
		</a>
	</main>
	<script src="script.js"></script>
</body>
</html>
