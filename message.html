<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Message For You 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="message-body">

    <!-- =========================
         MESSAGE PAGE
    ========================== -->

<main class="message-page">

    <!-- =========================
         CONVERSATION HEADER
    ========================== -->

    <header class="message-header">


        <div class="message-header-back">
            ‹
        </div>

        <div class="message-contact">

            <div class="message-contact-photo">
                B
            </div>

            <div class="message-contact-info">
                <h1>🔭</h1>
                <span>iMessage</span>
            </div>

        </div>

        <div class="message-header-info">
            ⓘ
        </div>

    </header>
	
	<div class="message-page-number">
		02 / 04
	</div>

    <!-- =========================
         CONVERSATION
    ========================== -->

    <section class="message-conversation">

        <div class="message-date">
            Today
        </div>


        <!-- MESSAGE 1 -->

        <div class="message-row message-row-left">

            <div class="message-bubble message-bubble-left">
                helloos hellos my love
            </div>

        </div>


        <!-- MESSAGE 2 -->

        <div class="message-row message-row-right">

            <div class="message-bubble message-bubble-right">
                helloos bbg
            </div>

        </div>


        <!-- MESSAGE 3 -->

        <div class="message-row message-row-left">

            <div class="message-bubble message-bubble-left">
                i gotta tell you something, its not bad bad
            </div>

        </div>


        <!-- MESSAGE 4 -->

        <div class="message-row message-row-right">

            <div class="message-bubble message-bubble-right">
                ohh no now im scared
            </div>

        </div>


        <!-- MESSAGE 5 -->

        <div class="message-row message-row-left">

            <div class="message-bubble message-bubble-left">
                look here...
            </div>

        </div>


        <!-- MESSAGE 6 -->

        <div class="message-row message-row-left message-special">

            <div class="message-bubble message-bubble-special">
			<a href="promposal.html" class="message-bubble message-bubble-special">
                ♥
			</a>
            </div>

        </div>

    </section>


    <!-- =========================
         MESSAGE INPUT
    ========================== -->

    <footer class="message-input-area">

        <div class="message-input">

            <span>
                iMessage
            </span>

            <span class="message-send">
                ↑
            </span>

        </div>
		
		<!-- =========================
     VISUAL IPHONE KEYBOARD
========================== -->

<section class="message-keyboard" aria-hidden="true">

    <div class="message-keyboard-row message-keyboard-row-top">
        <div class="message-key">Q</div>
        <div class="message-key">W</div>
        <div class="message-key">E</div>
        <div class="message-key">R</div>
        <div class="message-key">T</div>
        <div class="message-key">Y</div>
        <div class="message-key">U</div>
        <div class="message-key">I</div>
        <div class="message-key">O</div>
        <div class="message-key">P</div>
    </div>

    <div class="message-keyboard-row">
        <div class="message-key">A</div>
        <div class="message-key">S</div>
        <div class="message-key">D</div>
        <div class="message-key">F</div>
        <div class="message-key">G</div>
        <div class="message-key">H</div>
        <div class="message-key">J</div>
        <div class="message-key">K</div>
        <div class="message-key">L</div>
    </div>

    <div class="message-keyboard-row message-keyboard-row-middle">
        <div class="message-key message-key-special">⇧</div>

        <div class="message-key">Z</div>
        <div class="message-key">X</div>
        <div class="message-key">C</div>
        <div class="message-key">V</div>
        <div class="message-key">B</div>
        <div class="message-key">N</div>
        <div class="message-key">M</div>

        <div class="message-key message-key-special">⌫</div>
    </div>

    <div class="message-keyboard-row message-keyboard-row-bottom">

        <div class="message-key message-key-small">
            123
        </div>

        <div class="message-key message-key-small">
            🌐
        </div>

        <div class="message-key message-key-space">
            space
        </div>

        <div class="message-key message-key-small">
            ↵
        </div>

    </div>

</section>

    </footer>


    <!-- =========================
         NEXT PAGE
    ========================== -->

    <section class="message-ending">

    </section>

</main>



    <!-- PAGE TRANSITION -->
    <div
        class="message-transition"
        aria-hidden="true"
    ></div>


    <script src="script.js"></script>

</body>

</html>
